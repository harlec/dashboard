server {
    listen 80;

    # Subidas de Admin (tonos mp3 hasta 15 MB, imagen de fondo hasta 10 MB)
    client_max_body_size 20m;

    # Archivos estáticos del build React
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API → backend en localhost:5000
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Oficios: descargar un clip del NVR puede tardar varios minutos — sin este
    # bloque el proxy corta a los 60 s con un 504. Sin buffering para los ZIP/MP4 grandes.
    location /api/oficios/ {
        proxy_pass         http://backend:5000/api/oficios/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering    off;
    }

    # Proxy SignalR WebSocket
    location /hub/ {
        proxy_pass             http://backend:5000/hub/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_read_timeout     3600;
    }

    # React Router — todas las rutas al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
