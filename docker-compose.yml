services:

  sqlserver:
    build: ./sqlserver
    environment:
      SA_PASSWORD: ${DB_SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null -C
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    cap_add:
      - NET_RAW
    volumes:
      - audio_data:/app/audio
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Production
      # "sqlserver" = nombre del servicio en la red interna de Docker
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=red;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      JWT_SECRET: ${JWT_SECRET}
      AGENT_API_KEY: ${AGENT_API_KEY}
      CAM_EMAIL: ${CAM_EMAIL}
      CAM_PASSWORD: ${CAM_PASSWORD}
      CAM_EMAIL2: ${CAM_EMAIL2}
      CAM_PASSWORD2: ${CAM_PASSWORD2}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      GRAPH_SENDER: ${GRAPH_SENDER}
      CONSOLIDADO_CONN: ${CONSOLIDADO_CONN}
      TZ: America/Lima
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver_data:
  audio_data:

# NOTA: no se usa network_mode: host — la subred del bridge de Docker (172.18.0.0/16)
# no choca con la red interna (10.15.x.x / 10.18.x.x), así que el ping sale igual
# vía NAT del bridge normal, siempre que el host (Windows/WSL2) tenga ruta a esa red.
